<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>求职小助 · AI 求职陪跑管家</title>

<!-- 预连接：提前建立网络通道，加速 CDN 下载 -->
<link rel="dns-prefetch" href="https://unpkg.com" />
<link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />
<link rel="preconnect" href="https://unpkg.com" crossorigin />
<link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />

<!-- Logo: 指南针 SVG，双色扁平 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22none%22 stroke=%22%232563eb%22 stroke-width=%222%22/><path d=%22M16 7 L19 16 L16 25 L13 16 Z%22 fill=%22%2310b981%22/><circle cx=%2216%22 cy=%2216%22 r=%221.5%22 fill=%22%231a1a1a%22/></svg>" />

<meta name="description" content="AI 求职陪跑管家 · 帮大学生管理简历、JD、面试复盘全流程，越用越懂你。" />

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- React 18 CDN -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel 用于 JSX -->

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6',
            600: '#2563eb', 700: '#1d4ed8',
          },
          accent: {
            500: '#10b981', 600: '#059669',
          },
        },
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"Segoe UI"', 'PingFang SC', '"Microsoft YaHei"', 'sans-serif'],
        },
        boxShadow: {
          'soft': '0 1px 2px 0 rgb(0 0 0 / 0.04), 0 1px 3px 0 rgb(0 0 0 / 0.06)',
          'lifted': '0 4px 12px -2px rgb(0 0 0 / 0.08), 0 2px 4px -1px rgb(0 0 0 / 0.04)',
          'float': '0 12px 28px -6px rgb(0 0 0 / 0.12), 0 4px 8px -2px rgb(0 0 0 / 0.06)',
        },
        animation: {
          'fade-in': 'fadeIn 0.3s ease-out',
          'slide-up': 'slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1)',
          'scale-in': 'scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1)',
          'bounce-subtle': 'bounceSubtle 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55)',
        },
        keyframes: {
          fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
          slideUp: { '0%': { opacity: '0', transform: 'translateY(8px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
          scaleIn: { '0%': { opacity: '0', transform: 'scale(0.96)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
          bounceSubtle: { '0%': { transform: 'scale(1)' }, '50%': { transform: 'scale(1.04)' }, '100%': { transform: 'scale(1)' } },
        },
      },
    },
  };
</script>

<style>
  /* 自定义：苹果感交互 —— 克制的过渡、subtle 的反馈 */
  * { -webkit-tap-highlight-color: transparent; }
  html, body { scroll-behavior: smooth; }
  body {
    background: #f7f8fa;
    color: #111827;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  }

  /* 按钮：默认过渡 200ms cubic-bezier，hover 轻抬升，active 微缩 */
  .btn-apple {
    transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 180ms cubic-bezier(0.16, 1, 0.3, 1),
                background-color 140ms;
    will-change: transform;
  }
  .btn-apple:hover { transform: translateY(-1px); }
  .btn-apple:active { transform: translateY(0) scale(0.98); transition-duration: 80ms; }

  /* 卡片：hover 抬升，clickable 才加 cursor */
  .card-apple {
    transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 220ms cubic-bezier(0.16, 1, 0.3, 1),
                border-color 180ms;
  }
  .card-apple.clickable:hover {
    transform: translateY(-2px);
  }

  /* 滚动条极简风 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* 输入框聚焦：柔和蓝光 */
  input:focus, textarea:focus, select:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgb(37 99 235 / 0.12);
    border-color: #2563eb !important;
  }

  /* 禁止 textarea resize 成丑形状，弹窗内不设最小高度 */
  textarea { resize: vertical; min-height: 120px; }
  .modal-card textarea { min-height: auto; }

  /* 移动端侧边栏 overlay */
  @media (max-width: 767px) {
    .sidebar-mobile-overlay { display: block !important; }
  }

  /* ===== v3.2 高级动效系统（仅 CSS transform/opacity，GPU 加速，60fps） ===== */

  /* 页面入场：淡入 + 上移 */
  @keyframes pageEnter {
    0% { opacity: 0; transform: translateY(12px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .animate-page-enter {
    animation: pageEnter 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* 卡片交错浮现：子元素依次入场 */
  .stagger-cards > * {
    opacity: 0;
    animation: cardReveal 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes cardReveal {
    0% { opacity: 0; transform: translateY(16px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .stagger-cards > *:nth-child(1) { animation-delay: 0.05s; }
  .stagger-cards > *:nth-child(2) { animation-delay: 0.1s; }
  .stagger-cards > *:nth-child(3) { animation-delay: 0.15s; }
  .stagger-cards > *:nth-child(4) { animation-delay: 0.2s; }
  .stagger-cards > *:nth-child(5) { animation-delay: 0.25s; }
  .stagger-cards > *:nth-child(6) { animation-delay: 0.3s; }
  .stagger-cards > *:nth-child(7) { animation-delay: 0.35s; }
  .stagger-cards > *:nth-child(8) { animation-delay: 0.4s; }

  /* 骨架屏加载：脉冲呼吸 */
  @keyframes skeletonPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .skeleton {
    background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
    background-size: 200% 100%;
    animation: skeletonPulse 1.5s ease-in-out infinite;
    border-radius: 6px;
  }

  /* 数字跳动：配额计数器 */
  @keyframes countUp {
    0% { opacity: 0; transform: translateY(8px) scale(0.9); }
    60% { transform: translateY(-1px) scale(1.02); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .animate-count {
    animation: countUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* 卡片 hover 增强：3D 微抬 + 光晕 */
  .card-apple {
    transition: transform 280ms cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 280ms cubic-bezier(0.16, 1, 0.3, 1),
                border-color 200ms;
  }
  .card-apple.clickable:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px -6px rgb(0 0 0 / 0.12), 0 2px 6px -2px rgb(0 0 0 / 0.06);
  }
  .card-apple.clickable:active {
    transform: translateY(-1px);
    transition-duration: 100ms;
  }

  /* 标签入场：缩放弹出 */
  @keyframes tagPop {
    0% { opacity: 0; transform: scale(0.85); }
    70% { transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
  }
  .animate-tag-pop {
    animation: tagPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  /* 圆圈波纹：通知未读数 */
  @keyframes notifPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgb(244 63 94 / 0.4); }
    50% { box-shadow: 0 0 0 6px rgb(244 63 94 / 0); }
  }
  .badge-pulse {
    animation: notifPulse 2s ease-in-out infinite;
  }

  /* 输入框聚焦增强 */
  input:focus, textarea:focus, select:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgb(37 99 235 / 0.15), 0 2px 8px rgb(37 99 235 / 0.08);
    border-color: #2563eb !important;
    transition: box-shadow 250ms cubic-bezier(0.16, 1, 0.3, 1),
                border-color 200ms;
  }

  /* Toast 通知滑入增强 */
  @keyframes toastSlideIn {
    0% { opacity: 0; transform: translateX(24px) translateY(-8px); }
    100% { opacity: 1; transform: translateX(0) translateY(0); }
  }
  .animate-toast-in {
    animation: toastSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* ===== Modal 弹窗系统（纯 CSS + Portal 挂载到 body） ===== */

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    animation: overlayIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @supports (backdrop-filter: blur(1px)) {
    .modal-overlay { backdrop-filter: blur(2px); }
  }

  .modal-card {
    background: #fff;
    width: 100%;
    max-height: 60vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    border-radius: 16px;
    box-shadow: 0 0 0 0 rgb(0 0 0 / 0);
    animation: cardSpringIn 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
    background: #fff;
    border-bottom: 1px solid #f3f4f6;
    padding: 12px 16px;
    font-weight: 600;
    font-size: 14px;
    color: #111827;
  }
  .modal-header h3 { margin: 0; font-size: 14px; }
  .modal-body { padding: 16px; }

  @media (max-width: 639px) {
    .modal-overlay {
      align-items: flex-end;
      padding: 0;
      background: rgba(0, 0, 0, 0);
    }
    .modal-card {
      max-height: 70vh;
      border-radius: 16px 16px 0 0;
      animation: sheetSpringUp 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .modal-header { padding: 10px 14px; }
    .modal-body { padding: 14px; }
  }

  /* —— 动效关键帧 —— */

  /* 遮罩渐入 + 模糊 */
  @keyframes overlayIn {
    0%   { opacity: 0; background: rgba(0, 0, 0, 0); }
    100% { opacity: 1; background: rgba(0, 0, 0, 0.35); }
  }

  /* 桌面弹窗：弹性缩放入场（轻微 overshoot 回弹） */
  @keyframes cardSpringIn {
    0%   { opacity: 0; transform: scale(0.92) translateY(16px); box-shadow: 0 0 0 0 rgb(0 0 0 / 0); }
    60%  { opacity: 1; transform: scale(1.015) translateY(-2px); box-shadow: 0 8px 24px -4px rgb(0 0 0 / 0.08); }
    100% { opacity: 1; transform: scale(1) translateY(0);     box-shadow: 0 12px 28px -6px rgb(0 0 0 / 0.12), 0 4px 8px -2px rgb(0 0 0 / 0.06); }
  }

  /* 移动端底部抽屉：弹升入场 */
  @keyframes sheetSpringUp {
    0%   { opacity: 0; transform: translateY(70px); }
    65%  { opacity: 1; transform: translateY(-4px); }
    100% { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="root">
  <!-- 首次加载骨架屏：React 加载完成后会被替换 -->
  <div id="__skeleton" style="position: fixed; inset: 0; background: #f7f8fa; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
    <!-- Logo -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="48" height="48" style="animation: sk-breathe 2s ease-in-out infinite;">
      <circle cx="16" cy="16" r="13" fill="none" stroke="#2563eb" stroke-width="2"/>
      <path d="M16 7 L19 16 L16 25 L13 16 Z" fill="#10b981"/>
      <circle cx="16" cy="16" r="1.5" fill="#1a1a1a"/>
    </svg>
    <!-- 进度动效条 -->
    <div style="margin-top: 24px; width: 180px; height: 3px; background: #e5e7eb; border-radius: 2px; overflow: hidden;">
      <div style="height: 100%; width: 30%; background: #2563eb; border-radius: 2px; animation: sk-progress 1.6s ease-in-out infinite;"></div>
    </div>
    <!-- 文案 -->
    <div style="margin-top: 16px; font-size: 14px; color: #6b7280; animation: sk-fadeIn 0.8s ease-out both 0.3s;">
      首次加载较慢，AI 正在准备中<span style="display: inline-block; animation: sk-dots 1.5s steps(1) infinite;">…</span>
    </div>
    <div style="margin-top: 6px; font-size: 11px; color: #9ca3af; animation: sk-fadeIn 0.8s ease-out both 0.6s;">
      下次打开会快很多哦
    </div>
  </div>

  <style>
    @keyframes sk-breathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.97); }
    }
    @keyframes sk-progress {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(240%); }
      100% { transform: translateX(-100%); }
    }
    @keyframes sk-fadeIn {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes sk-dots {
      0% { content: '…'; }
      25% { display: inline; }
      50% { content: '…'; }
      75% { display: none; }
      100% { content: '…'; }
    }
  </style>
</div>

<script src="app.js"></script>
</body>
</html>
